<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Dung Beetle Push</title>
<style>
:root{
  --board-size: 560px;
  --cell: 80px;
  --ink: #111;
  --paper: #fff;
  --bg: #f5f2ec;
  --line: #111;
  --muted: #777;
  --yellow: #f4c542;
  --blue: #6bb6d9;
  --green: #77ba74;
  --purple: #b67ac6;
  --orange: #e98a52;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--ink);
  font-family: Arial, Helvetica, sans-serif;
  display:flex;
  justify-content:center;
  padding:28px 16px 40px;
}

.game-container{
  width:min(680px, 100%);
}

.header-row{
  position:relative;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  margin-bottom:16px;
}

.title{
  margin:0;
  font-size:42px;
  line-height:1;
  text-transform:uppercase;
  letter-spacing:.02em;
  font-weight:1000;
  text-align:center;
}

.help-btn{
  justify-self:end;
  width:34px;
  height:34px;
  border:3px solid var(--ink);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:1000;
  cursor:default;
  background:#fff;
}

.level-nav{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  min-height:70px;
  margin-bottom:12px;
}

.selector-group{
  display:flex;
  align-items:center;
  gap:14px;
}

.level-label{
  min-width:104px;
  text-align:center;
  line-height:1;
}

.level-label .sub{
  display:block;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.12em;
  font-weight:900;
  color:#666;
  margin-bottom:3px;
}

.level-label .num{
  display:block;
  font-size:30px;
  font-weight:1000;
}

.push-counter{
  justify-self:start;
  text-align:left;
  min-width:78px;
  line-height:1;
}

.push-counter .label{
  display:block;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.10em;
  font-weight:900;
  color:#55708a;
  margin-bottom:2px;
}

.push-counter .count{
  display:block;
  font-size:30px;
  font-weight:1000;
  color:#163b5c;
  line-height:.95;
}

.push-counter .minimum{
  display:block;
  margin-top:4px;
  font-size:11px;
  font-weight:900;
  letter-spacing:.06em;
  color:#55708a;
}

.nav-arrow{
  border:none;
  background:none;
  font-size:27px;
  font-weight:900;
  padding:4px 7px;
  cursor:pointer;
}
.nav-arrow:disabled{
  opacity:.18;
  cursor:default;
}

.game-stage{
  display:flex;
  justify-content:center;
}

#board{
  position:relative;
  width:var(--board-size);
  height:var(--board-size);
  display:grid;
  grid-template-columns:repeat(7, 1fr);
  grid-template-rows:repeat(7, 1fr);
  background:#fff;
  border:4px solid var(--ink);
  box-shadow:0 3px 0 rgba(0,0,0,.08);
  overflow:hidden;
}

.cell{
  border-right:1.5px solid #bbb;
  border-bottom:1.5px solid #bbb;
  position:relative;
  background:#fff;
}

.cell:nth-child(7n){ border-right:none; }
.cell:nth-last-child(-n+7){ border-bottom:none; }

.cell.target::after{
  content:"";
  position:absolute;
  inset:18px;
  border-radius:50%;
  background:#2b211b;
  box-shadow:inset 0 0 0 5px rgba(0,0,0,.18);
  z-index:1;
}

#holeOverlay{
  position:absolute;
  border-radius:50%;
  background:#2b211b;
  box-shadow:inset 0 0 0 5px rgba(0,0,0,.18);
  opacity:.22;
  z-index:6;
  pointer-events:none;
  display:none;
}

.block{
  position:absolute;
  width:var(--cell);
  height:var(--cell);
  border:3px solid var(--ink);
  z-index:3;
  transition:left 90ms linear, top 90ms linear;
}

.block::after{
  content:"";
  position:absolute;
  inset:6px;
  border:2px solid rgba(255,255,255,.42);
  pointer-events:none;
}

#ball{
  position:absolute;
  width:56px;
  height:56px;
  border-radius:50%;
  background:#6b4b2f;
  border:3px solid var(--ink);
  z-index:7;
  box-shadow:inset -7px -7px 0 rgba(0,0,0,.10);
  transition:left 90ms linear, top 90ms linear;
  pointer-events:none;
}

.piece-0{background:var(--yellow)}
.piece-1{background:var(--blue)}
.piece-2{background:var(--green)}
.piece-3{background:var(--purple)}
.piece-4{background:var(--orange)}

#player{
  position:absolute;
  width:62px;
  height:62px;
  z-index:8;
  transition:left 90ms linear, top 90ms linear;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
}

#player svg{
  width:58px;
  height:58px;
  overflow:visible;
}

.button-tray{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:18px;
}

button.btn-secondary,
button.btn-primary{
  min-height:52px;
  border:3px solid var(--ink);
  border-radius:0;
  font-size:16px;
  font-weight:1000;
  text-transform:uppercase;
  letter-spacing:.05em;
  cursor:pointer;
}

button.btn-secondary{
  background:#fff;
  color:var(--ink);
}

button.btn-secondary:hover{ background:#f6f6f6; }

button.btn-primary{
  width:100%;
  margin-top:14px;
  background:var(--ink);
  color:#fff;
}

button:disabled{
  opacity:.3;
  cursor:default;
}

#status{
  min-height:44px;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:14px 0 0;
  font-size:13px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:#666;
}

#status.won{
  color:var(--ink);
  font-size:17px;
}


.dpad-wrap{
  display:flex;
  justify-content:center;
  margin-top:16px;
}

.dpad{
  width:174px;
  display:grid;
  grid-template-columns:54px 54px 54px;
  grid-template-rows:54px 54px 54px;
  gap:6px;
  align-items:center;
  justify-items:center;
  user-select:none;
  -webkit-user-select:none;
}

.dpad button{
  width:54px;
  height:54px;
  border:3px solid var(--ink);
  background:#fff;
  font-size:27px;
  font-weight:1000;
  line-height:1;
  padding:0;
  cursor:pointer;
  touch-action:manipulation;
}

.dpad button:active{
  background:#ececec;
}

.dpad-up{grid-column:2;grid-row:1}
.dpad-left{grid-column:1;grid-row:2}
.dpad-right{grid-column:3;grid-row:2}
.dpad-down{grid-column:2;grid-row:3}

#board{
  touch-action:none;
}


@keyframes bugCelebrate{
  0%   { transform: rotate(0deg) scale(1); }
  15%  { transform: rotate(-14deg) scale(1.06); }
  30%  { transform: rotate(14deg) scale(1.06); }
  45%  { transform: rotate(-11deg) scale(1.05); }
  60%  { transform: rotate(11deg) scale(1.05); }
  75%  { transform: rotate(-6deg) scale(1.03); }
  90%  { transform: rotate(6deg) scale(1.02); }
  100% { transform: rotate(0deg) scale(1); }
}

#player.celebrating{
  animation: bugCelebrate 700ms ease-in-out 1;
  transform-origin: 50% 55%;
}

@media (max-width:620px){
  :root{
    --board-size: calc(100vw - 32px);
    --cell: calc((100vw - 32px) / 7);
  }
  .title{font-size:34px}
  #player{
    width:calc(var(--cell) * .78);
    height:calc(var(--cell) * .78);
  }
  #player svg{
    width:100%;
    height:100%;
  }
  #ball{
    width:calc(var(--cell) * .70);
    height:calc(var(--cell) * .70);
  }
  .cell.target::after{inset:24%}
}
</style>
</head>
<body>
<div class="game-container">
  <div class="header-row">
    <div></div>
    <h1 class="title">Dung Beetle</h1>
    <div class="help-btn">?</div>
  </div>

  <div class="level-nav">
    <div class="push-counter">
      <span class="label">Pushes</span>
      <span class="count" id="pushCount">0</span>
      <span class="minimum">MIN=<span id="minPushes">—</span></span>
    </div>
    <div class="selector-group">
      <button class="nav-arrow" id="prevPuzzle" aria-label="Previous puzzle">←</button>
      <div class="level-label">
        <span class="sub">Puzzle</span>

      </div>
      <button class="nav-arrow" id="nextPuzzle" aria-label="Next puzzle">→</button>
    </div>
    <div></div>
  </div>

  <div class="game-stage">
    <div id="board"></div>
  </div>

  <div class="button-tray">
    <button id="undoBtn" class="btn-secondary">Undo</button>
    <button id="resetBtn" class="btn-secondary">Reset</button>
    <button id="newBtn" class="btn-secondary">New</button>
  </div>

  <div class="dpad-wrap" aria-label="Movement controls">
    <div class="dpad">
      <button class="dpad-up" id="moveUp" aria-label="Move up">▲</button>
      <button class="dpad-left" id="moveLeft" aria-label="Move left">◀</button>
      <button class="dpad-right" id="moveRight" aria-label="Move right">▶</button>
      <button class="dpad-down" id="moveDown" aria-label="Move down">▼</button>
    </div>
  </div>

  <div id="status">Roll the ball into the hole</div>
</div>

<script>
const DEFAULT_SIZE = 7;
const BASE_SHAPES = [
  [[0,0],[0,1],[0,2],[1,1]],          // T
  [[0,0],[1,0],[2,0],[2,1]],          // L
  [[0,1],[0,2],[1,0],[1,1]],          // S
  [[0,0],[1,0],[2,0],[3,0]],          // I
  [[0,0],[0,1],[1,0],[1,1]]           // O
];


const CURATED_PUZZLES = [{"pieces":[{"cells":[{"r":3,"c":0},{"r":3,"c":1},{"r":3,"c":2},{"r":4,"c":1}]},{"cells":[{"r":3,"c":3},{"r":4,"c":3},{"r":5,"c":3},{"r":5,"c":4}]},{"cells":[{"r":1,"c":3},{"r":1,"c":4},{"r":2,"c":2},{"r":2,"c":3}]},{"cells":[{"r":0,"c":3},{"r":0,"c":4},{"r":0,"c":5},{"r":0,"c":6}]},{"cells":[{"r":3,"c":5},{"r":3,"c":6},{"r":4,"c":5},{"r":4,"c":6}]}],"player":{"r":2,"c":0},"ball":{"r":1,"c":2},"target":{"r":6,"c":1},"minPushes":9},{"pieces":[{"cells":[{"r":3,"c":5},{"r":4,"c":5},{"r":4,"c":6},{"r":5,"c":5}]},{"cells":[{"r":4,"c":1},{"r":4,"c":2},{"r":5,"c":2},{"r":6,"c":2}]},{"cells":[{"r":1,"c":2},{"r":1,"c":3},{"r":2,"c":1},{"r":2,"c":2}]},{"cells":[{"r":3,"c":0},{"r":3,"c":1},{"r":3,"c":2},{"r":3,"c":3}]},{"cells":[{"r":0,"c":0},{"r":0,"c":1},{"r":1,"c":0},{"r":1,"c":1}]}],"player":{"r":2,"c":0},"ball":{"r":5,"c":1},"target":{"r":5,"c":6},"minPushes":7},{"pieces":[{"cells":[{"r":3,"c":5},{"r":4,"c":4},{"r":4,"c":5},{"r":5,"c":5}]},{"cells":[{"r":0,"c":4},{"r":0,"c":5},{"r":1,"c":5},{"r":2,"c":5}]},{"cells":[{"r":2,"c":1},{"r":2,"c":2},{"r":3,"c":0},{"r":3,"c":1}]},{"cells":[{"r":3,"c":2},{"r":4,"c":2},{"r":5,"c":2},{"r":6,"c":2}]},{"cells":[{"r":2,"c":3},{"r":2,"c":4},{"r":3,"c":3},{"r":3,"c":4}]}],"player":{"r":4,"c":0},"ball":{"r":4,"c":3},"target":{"r":4,"c":6},"minPushes":12},{"pieces":[{"cells":[{"r":1,"c":2},{"r":2,"c":2},{"r":2,"c":3},{"r":3,"c":2}]},{"cells":[{"r":0,"c":3},{"r":0,"c":4},{"r":1,"c":4},{"r":2,"c":4}]},{"cells":[{"r":1,"c":0},{"r":2,"c":0},{"r":2,"c":1},{"r":3,"c":1}]},{"cells":[{"r":5,"c":0},{"r":5,"c":1},{"r":5,"c":2},{"r":5,"c":3}]},{"cells":[{"r":3,"c":4},{"r":3,"c":5},{"r":4,"c":4},{"r":4,"c":5}]}],"player":{"r":0,"c":6},"ball":{"r":4,"c":1},"target":{"r":0,"c":0},"minPushes":8},{"pieces":[{"cells":[{"r":3,"c":4},{"r":4,"c":3},{"r":4,"c":4},{"r":4,"c":5}]},{"cells":[{"r":3,"c":0},{"r":3,"c":1},{"r":4,"c":1},{"r":5,"c":1}]},{"cells":[{"r":1,"c":2},{"r":2,"c":2},{"r":2,"c":3},{"r":3,"c":3}]},{"cells":[{"r":0,"c":6},{"r":1,"c":6},{"r":2,"c":6},{"r":3,"c":6}]},{"cells":[{"r":1,"c":0},{"r":1,"c":1},{"r":2,"c":0},{"r":2,"c":1}]}],"player":{"r":1,"c":4},"ball":{"r":3,"c":5},"target":{"r":5,"c":0},"minPushes":8},{"pieces":[{"cells":[{"r":5,"c":0},{"r":5,"c":1},{"r":5,"c":2},{"r":6,"c":1}]},{"cells":[{"r":5,"c":6},{"r":6,"c":4},{"r":6,"c":5},{"r":6,"c":6}]},{"cells":[{"r":3,"c":3},{"r":4,"c":3},{"r":4,"c":4},{"r":5,"c":4}]},{"cells":[{"r":1,"c":5},{"r":2,"c":5},{"r":3,"c":5},{"r":4,"c":5}]},{"cells":[{"r":0,"c":2},{"r":0,"c":3},{"r":1,"c":2},{"r":1,"c":3}]}],"player":{"r":5,"c":5},"ball":{"r":2,"c":4},"target":{"r":6,"c":2},"minPushes":7},{"pieces":[{"cells":[{"r":4,"c":2},{"r":5,"c":1},{"r":5,"c":2},{"r":6,"c":2}]},{"cells":[{"r":3,"c":5},{"r":4,"c":5},{"r":5,"c":5},{"r":5,"c":6}]},{"cells":[{"r":4,"c":3},{"r":5,"c":3},{"r":5,"c":4},{"r":6,"c":4}]},{"cells":[{"r":1,"c":0},{"r":1,"c":1},{"r":1,"c":2},{"r":1,"c":3}]},{"cells":[{"r":2,"c":0},{"r":2,"c":1},{"r":3,"c":0},{"r":3,"c":1}]}],"player":{"r":6,"c":1},"ball":{"r":2,"c":4},"target":{"r":2,"c":2},"minPushes":8},{"pieces":[{"cells":[{"r":1,"c":1},{"r":2,"c":0},{"r":2,"c":1},{"r":2,"c":2}]},{"cells":[{"r":1,"c":3},{"r":1,"c":4},{"r":1,"c":5},{"r":2,"c":3}]},{"cells":[{"r":3,"c":1},{"r":4,"c":1},{"r":4,"c":2},{"r":5,"c":2}]},{"cells":[{"r":2,"c":5},{"r":3,"c":5},{"r":4,"c":5},{"r":5,"c":5}]},{"cells":[{"r":3,"c":3},{"r":3,"c":4},{"r":4,"c":3},{"r":4,"c":4}]}],"player":{"r":6,"c":4},"ball":{"r":4,"c":0},"target":{"r":1,"c":0},"minPushes":7},{"pieces":[{"cells":[{"r":0,"c":2},{"r":1,"c":2},{"r":1,"c":3},{"r":2,"c":2}]},{"cells":[{"r":3,"c":4},{"r":4,"c":4},{"r":5,"c":4},{"r":5,"c":5}]},{"cells":[{"r":2,"c":3},{"r":2,"c":4},{"r":3,"c":2},{"r":3,"c":3}]},{"cells":[{"r":1,"c":6},{"r":2,"c":6},{"r":3,"c":6},{"r":4,"c":6}]},{"cells":[{"r":5,"c":1},{"r":5,"c":2},{"r":6,"c":1},{"r":6,"c":2}]}],"player":{"r":0,"c":3},"ball":{"r":2,"c":5},"target":{"r":5,"c":0},"minPushes":7},{"pieces":[{"cells":[{"r":3,"c":5},{"r":4,"c":5},{"r":4,"c":6},{"r":5,"c":5}]},{"cells":[{"r":3,"c":2},{"r":3,"c":3},{"r":3,"c":4},{"r":4,"c":2}]},{"cells":[{"r":2,"c":0},{"r":3,"c":0},{"r":3,"c":1},{"r":4,"c":1}]},{"cells":[{"r":2,"c":2},{"r":2,"c":3},{"r":2,"c":4},{"r":2,"c":5}]},{"cells":[{"r":5,"c":3},{"r":5,"c":4},{"r":6,"c":3},{"r":6,"c":4}]}],"player":{"r":0,"c":0},"ball":{"r":1,"c":1},"target":{"r":5,"c":1},"minPushes":8}];

let state = null;
let initialState = null;
let history = [];
let puzzleLibrary = CURATED_PUZZLES.map(p => normalizePuzzleInput(p, true));
let currentPuzzleIndex = 0;
let currentMinPushes = null;
let pushCount = 0;
let isSolved = false;

const board = document.getElementById("board");
const statusEl = document.getElementById("status");
const resetBtn = document.getElementById("resetBtn");
const newBtn = document.getElementById("newBtn");
const undoBtn = document.getElementById("undoBtn");
const puzzleNumEl = document.getElementById("puzzleNum");
const minPushesEl = document.getElementById("minPushes");
const pushCountEl = document.getElementById("pushCount");

function clone(x){ return JSON.parse(JSON.stringify(x)); }

function normalizePuzzleInput(raw, expectBall){
  const p=clone(raw);

  // Finder format: pieces is an object keyed by tetromino type.
  let pieces=[];
  if(Array.isArray(p.pieces)){
    pieces=p.pieces.map(piece=>({
      type: piece.type ?? null,
      cells: piece.cells.map(cell=>Array.isArray(cell)
        ? {r:cell[0],c:cell[1]}
        : {r:cell.r,c:cell.c})
    }));
  }else{
    for(const [type,instances] of Object.entries(p.pieces || {})){
      for(const cells of instances){
        pieces.push({
          type,
          cells:cells.map(([r,c])=>({r,c}))
        });
      }
    }
  }

  const toCell=value=>Array.isArray(value)
    ? {r:value[0],c:value[1]}
    : value ? {r:value.r,c:value.c} : null;

  // Old built-in puzzles did not store size, so infer it when necessary.
  let maxCoord=-1;
  pieces.forEach(piece=>piece.cells.forEach(cell=>{
    maxCoord=Math.max(maxCoord,cell.r,cell.c);
  }));
  for(const value of [p.player,p.ball,p.hole,p.target]){
    if(value){
      const cell=toCell(value);
      maxCoord=Math.max(maxCoord,cell.r,cell.c);
    }
  }

  const normalized={
    size:p.size ?? Math.max(DEFAULT_SIZE,maxCoord+1),
    pieces,
    player:toCell(p.player),
    target:toCell(p.hole ?? p.target),
    minPushes:p.pushes ?? p.minPushes ?? null,
    pushes:p.pushes ?? p.minPushes ?? null,
    blocksMoved:p.blocksMoved ?? null,
    solns:p.solns ?? null,
    solution:p.solution ?? ''
  };

  if(expectBall){
    normalized.ball=toCell(p.ball);
    normalized.ballPushes=p.ballPushes ?? null;
  }
  return normalized;
}

function boardSize(){
  return state?.size ?? initialState?.size ?? DEFAULT_SIZE;
}
function randInt(n){ return Math.floor(Math.random()*n); }

function shuffled(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=randInt(i+1);
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function normalizeShape(shape){
  const minR=Math.min(...shape.map(([r])=>r));
  const minC=Math.min(...shape.map(([,c])=>c));
  return shape.map(([r,c])=>[r-minR,c-minC])
    .sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
}

function rotateShape(shape){
  return normalizeShape(shape.map(([r,c])=>[c,-r]));
}

function uniqueOrientations(shape){
  const out=[];
  let cur=normalizeShape(shape);
  for(let i=0;i<4;i++){
    const k=JSON.stringify(cur);
    if(!out.some(s=>JSON.stringify(s)===k)) out.push(cur);
    cur=rotateShape(cur);
  }
  return out;
}

const ORIENTATIONS=BASE_SHAPES.map(uniqueOrientations);

function keyCell(r,c){ return r+","+c; }
function inBounds(r,c){ const n=boardSize(); return r>=0&&r<n&&c>=0&&c<n; }

function randomPlacement(){
  const n=boardSize();
  const occupied=new Set();
  const pieces=[];

  for(let i=0;i<ORIENTATIONS.length;i++){
    let placed=false;
    for(const shape of shuffled(ORIENTATIONS[i])){
      const h=Math.max(...shape.map(([r])=>r))+1;
      const w=Math.max(...shape.map(([,c])=>c))+1;
      const origins=[];
      for(let r=0;r<=n-h;r++){
        for(let c=0;c<=n-w;c++) origins.push([r,c]);
      }

      for(const [r0,c0] of shuffled(origins)){
        const cells=shape.map(([r,c])=>({r:r+r0,c:c+c0}));
        if(cells.every(p=>!occupied.has(keyCell(p.r,p.c)))){
          cells.forEach(p=>occupied.add(keyCell(p.r,p.c)));
          pieces.push({cells});
          placed=true;
          break;
        }
      }
      if(placed) break;
    }
    if(!placed) return null;
  }

  const empty=[];
  for(let r=0;r<n;r++){
    for(let c=0;c<n;c++){
      if(!occupied.has(keyCell(r,c))) empty.push({r,c});
    }
  }
  if(empty.length<3) return null;
  const picks=shuffled(empty);
  return {size:n, pieces, player:picks[0], ball:picks[1], target:picks[2]};
}

function buildBoard(){
  const n=boardSize();
  board.innerHTML="";
  board.style.gridTemplateColumns=`repeat(${n}, 1fr)`;
  board.style.gridTemplateRows=`repeat(${n}, 1fr)`;
  for(let r=0;r<n;r++){
    for(let c=0;c<n;c++){
      const div=document.createElement("div");
      div.className="cell";
      div.dataset.r=r;
      div.dataset.c=c;
      if(c===n-1) div.style.borderRight="none";
      if(r===n-1) div.style.borderBottom="none";
      board.appendChild(div);
    }
  }

  const ball=document.createElement("div");
  ball.id="ball";
  board.appendChild(ball);

  const holeOverlay=document.createElement("div");
  holeOverlay.id="holeOverlay";
  board.appendChild(holeOverlay);

  const player=document.createElement("div");
  player.id="player";
  player.innerHTML=`
    <svg viewBox="0 0 28 28" aria-hidden="true">
      <path d="M10 6 Q 8 2 6 4" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M18 6 Q 20 2 22 4" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
      <g stroke="#000" stroke-width="1.5" stroke-linecap="round">
        <line x1="8" y1="12" x2="3" y2="10"/><line x1="7" y1="16" x2="2" y2="16"/><line x1="8" y1="20" x2="3" y2="22"/>
        <line x1="20" y1="12" x2="25" y2="10"/><line x1="21" y1="16" x2="26" y2="16"/><line x1="20" y1="20" x2="25" y2="22"/>
      </g>
      <circle cx="14" cy="16" r="9" fill="#FF3B30" stroke="#000" stroke-width="1"/>
      <path d="M8 13 A 7 7 0 0 1 20 13" fill="#000"/>
      <circle cx="11" cy="17" r="1.5" fill="white"/>
      <circle cx="17" cy="17" r="1.5" fill="white"/>
    </svg>`;
  board.appendChild(player);
}

function cellSize(){ return board.clientWidth/boardSize(); }

function render(){
  if(!state) return;
  if(!document.getElementById("player") || document.querySelectorAll(".cell").length!==boardSize()*boardSize()) buildBoard();

  document.querySelectorAll(".cell").forEach(el=>el.classList.remove("target"));
  const target=document.querySelector(`.cell[data-r="${state.target.r}"][data-c="${state.target.c}"]`);
  if(target) target.classList.add("target");

  document.querySelectorAll(".block").forEach(el=>el.remove());

  const cs=cellSize();
  document.documentElement.style.setProperty("--cell", cs+"px");

  state.pieces.forEach((piece,pi)=>{
    piece.cells.forEach(cell=>{
      const b=document.createElement("div");
      b.className=`block piece-${pi%5}`;
      b.style.left=(cell.c*cs)+"px";
      b.style.top=(cell.r*cs)+"px";
      board.appendChild(b);
    });
  });

  const ball=document.getElementById("ball");
  const bs=Math.min(56, cs*.70);
  ball.style.width=bs+"px";
  ball.style.height=bs+"px";
  ball.style.left=(state.ball.c*cs+(cs-bs)/2)+"px";
  ball.style.top=(state.ball.r*cs+(cs-bs)/2)+"px";

  const holeOverlay=document.getElementById("holeOverlay");
  const targetCovered = pieceAtIn(state.pieces, state.target.r, state.target.c) !== -1;
  if(targetCovered){
    const hs = cs * .55;
    holeOverlay.style.width=hs+"px";
    holeOverlay.style.height=hs+"px";
    holeOverlay.style.left=(state.target.c*cs+(cs-hs)/2)+"px";
    holeOverlay.style.top=(state.target.r*cs+(cs-hs)/2)+"px";
    holeOverlay.style.display="block";
  }else{
    holeOverlay.style.display="none";
  }

  const player=document.getElementById("player");
  if(!isSolved) player.classList.remove("celebrating");
  const ps=Math.min(62, cs*.78);
  player.style.width=ps+"px";
  player.style.height=ps+"px";
  player.style.left=(state.player.c*cs+(cs-ps)/2)+"px";
  player.style.top=(state.player.r*cs+(cs-ps)/2)+"px";

  undoBtn.disabled=history.length===0;
  resetBtn.disabled=history.length===0;
}

function pieceAtIn(pieces,r,c){
  for(let i=0;i<pieces.length;i++){
    if(pieces[i].cells.some(p=>p.r===r&&p.c===c)) return i;
  }
  return -1;
}

function pieceAt(r,c){ return pieceAtIn(state.pieces,r,c); }

function canMovePieceIn(pieces,pi,dr,dc){
  for(const cell of pieces[pi].cells){
    const nr=cell.r+dr,nc=cell.c+dc;
    if(!inBounds(nr,nc)) return false;
    const other=pieceAtIn(pieces,nr,nc);
    if(other!==-1&&other!==pi) return false;
  }
  return true;
}

function piecesKey(pieces){
  return pieces.map(piece=>
    piece.cells.slice().sort((a,b)=>a.r-b.r||a.c-b.c)
      .map(p=>p.r+","+p.c).join(";")
  ).join("|");
}

function occupiedSet(pieces){
  const s=new Set();
  pieces.forEach(piece=>piece.cells.forEach(p=>s.add(keyCell(p.r,p.c))));
  return s;
}

function reachableCells(pieces,start){
  const occ=occupiedSet(pieces);
  const seen=new Set([keyCell(start.r,start.c)]);
  const q=[start];
  for(let i=0;i<q.length;i++){
    const cur=q[i];
    for(const [dr,dc] of [[-1,0],[1,0],[0,-1],[0,1]]){
      const nr=cur.r+dr,nc=cur.c+dc,k=keyCell(nr,nc);
      if(!inBounds(nr,nc)||occ.has(k)||seen.has(k)) continue;
      seen.add(k); q.push({r:nr,c:nc});
    }
  }
  return seen;
}

function canonicalReachableKey(reach){ return [...reach].sort().join("/"); }

function solvePuzzle(puzzle, options={}){
  const {
    maxStates=50000,
    allowedPieces=null,
    requireTwoPieces=false
  }=options;

  // Cost = tetromino pushes only. Ball pushes cost 0.
  // We use a deque (0-1 BFS): ball pushes/walking-region changes are zero-cost;
  // tetromino pushes cost 1.
  function stateKey(pieces, ball, reach, movedMask){
    return piecesKey(pieces)+"#B"+keyCell(ball.r,ball.c)+"#R"+
      canonicalReachableKey(reach)+"#M"+movedMask;
  }

  function occupiedWithBall(pieces, ball){
    const s=occupiedSet(pieces);
    s.add(keyCell(ball.r,ball.c));
    return s;
  }

  function reachableWithBall(pieces, ball, start){
    const occ=occupiedWithBall(pieces,ball);
    const seen=new Set([keyCell(start.r,start.c)]);
    const q=[start];
    for(let i=0;i<q.length;i++){
      const cur=q[i];
      for(const [dr,dc] of [[-1,0],[1,0],[0,-1],[0,1]]){
        const nr=cur.r+dr,nc=cur.c+dc,k=keyCell(nr,nc);
        if(!inBounds(nr,nc)||occ.has(k)||seen.has(k)) continue;
        seen.add(k); q.push({r:nr,c:nc});
      }
    }
    return seen;
  }

  function canMovePieceWithBall(pieces, ball, pi, dr, dc){
    for(const cell of pieces[pi].cells){
      const nr=cell.r+dr,nc=cell.c+dc;
      if(!inBounds(nr,nc)) return false;
      if(nr===ball.r && nc===ball.c) return false;
      const other=pieceAtIn(pieces,nr,nc);
      if(other!==-1&&other!==pi) return false;
    }
    return true;
  }

  const startReach=reachableWithBall(puzzle.pieces,puzzle.ball,puzzle.player);
  const start={pieces:clone(puzzle.pieces),ball:clone(puzzle.ball),player:clone(puzzle.player),cost:0,movedMask:0};

  const deque=[start];
  const best=new Map();
  best.set(stateKey(start.pieces,start.ball,startReach,0),0);

  while(deque.length){
    if(best.size>maxStates) return {solvable:false,cutoff:true};

    const node=deque.shift();
    const reach=reachableWithBall(node.pieces,node.ball,node.player);

    if(node.ball.r===puzzle.target.r && node.ball.c===puzzle.target.c){
      const movedCount=node.movedMask.toString(2).split("1").length-1;
      if(!requireTwoPieces || movedCount>=2){
        return {solvable:true,pushes:node.cost,movedMask:node.movedMask};
      }
    }

    // Zero-cost ball pushes.
    for(const [dr,dc] of [[-1,0],[1,0],[0,-1],[0,1]]){
      const behind={r:node.ball.r-dr,c:node.ball.c-dc};
      const ahead={r:node.ball.r+dr,c:node.ball.c+dc};
      if(!inBounds(behind.r,behind.c)||!inBounds(ahead.r,ahead.c)) continue;
      if(!reach.has(keyCell(behind.r,behind.c))) continue;
      if(pieceAtIn(node.pieces,ahead.r,ahead.c)!==-1) continue;

      const newBall={r:ahead.r,c:ahead.c};
      const newPlayer={r:node.ball.r,c:node.ball.c};
      const newReach=reachableWithBall(node.pieces,newBall,newPlayer);
      const k=stateKey(node.pieces,newBall,newReach,node.movedMask);

      if(!best.has(k) || node.cost<best.get(k)){
        best.set(k,node.cost);
        deque.unshift({
          pieces:clone(node.pieces),
          ball:newBall,
          player:newPlayer,
          cost:node.cost,
          movedMask:node.movedMask
        });
      }
    }

    // Cost-1 tetromino pushes.
    for(let pi=0;pi<node.pieces.length;pi++){
      if(allowedPieces&&!allowedPieces.has(pi)) continue;
      const piece=node.pieces[pi];

      for(const [dr,dc] of [[-1,0],[1,0],[0,-1],[0,1]]){
        let newPlayer=null;

        for(const cell of piece.cells){
          const behind={r:cell.r-dr,c:cell.c-dc};
          const samePieceBehind=piece.cells.some(p=>p.r===behind.r&&p.c===behind.c);
          if(samePieceBehind) continue;
          if(inBounds(behind.r,behind.c)&&reach.has(keyCell(behind.r,behind.c))){
            newPlayer={r:cell.r,c:cell.c};
            break;
          }
        }

        if(!newPlayer) continue;
        if(!canMovePieceWithBall(node.pieces,node.ball,pi,dr,dc)) continue;

        const newPieces=clone(node.pieces);
        newPieces[pi].cells.forEach(cell=>{cell.r+=dr;cell.c+=dc});
        const newMask=node.movedMask|(1<<pi);
        const newCost=node.cost+1;
        const newReach=reachableWithBall(newPieces,node.ball,newPlayer);
        const k=stateKey(newPieces,node.ball,newReach,newMask);

        if(!best.has(k)||newCost<best.get(k)){
          best.set(k,newCost);
          deque.push({
            pieces:newPieces,
            ball:clone(node.ball),
            player:newPlayer,
            cost:newCost,
            movedMask:newMask
          });
        }
      }
    }
  }

  return {solvable:false};
}

function requiresAtLeastTwoPieces(puzzle){
  // No solution may exist with only one tetromino movable.
  for(let pi=0;pi<puzzle.pieces.length;pi++){
    const result=solvePuzzle(puzzle,{
      maxStates:18000,
      allowedPieces:new Set([pi]),
      requireTwoPieces:false
    });
    if(result.solvable) return false;
  }
  return true;
}

function loadPuzzle(index){
  if(index<0 || index>=puzzleLibrary.length) return;
  currentPuzzleIndex=index;
  const p=normalizePuzzleInput(puzzleLibrary[index], true);
  puzzleLibrary[index]=clone(p);
  initialState=clone(p);
  state=clone(p);
  history=[];
  isSolved=false;
  pushCount=0;
  currentMinPushes=p.minPushes ?? null;
  puzzleNumEl.textContent=index+1;
  minPushesEl.textContent=currentMinPushes ?? "—";
  pushCountEl.textContent=pushCount;
  statusEl.textContent="Roll the ball into the hole";
  statusEl.className="";
  document.getElementById("prevPuzzle").disabled=index===0;
  document.getElementById("nextPuzzle").disabled=index===puzzleLibrary.length-1;
  render();
}

async function generateNewPuzzle(){
  newBtn.disabled=true;
  statusEl.textContent="Finding a dung beetle puzzle…";
  statusEl.className="";

  await new Promise(r=>setTimeout(r,20));

  for(let attempt=1;attempt<=1600;attempt++){
    const candidate=randomPlacement();
    if(!candidate) continue;

    const result=solvePuzzle(candidate,{maxStates:50000,requireTwoPieces:true});
    if(!result.solvable||result.cutoff||result.pushes<7){
      if(attempt%10===0) await new Promise(r=>setTimeout(r,0));
      continue;
    }
    if(!requiresAtLeastTwoPieces(candidate)){
      if(attempt%10===0) await new Promise(r=>setTimeout(r,0));
      continue;
    }

    candidate.minPushes=result.pushes;
    puzzleLibrary.push(clone(candidate));
    newBtn.disabled=false;
    loadPuzzle(puzzleLibrary.length-1);
    return;
  }

  statusEl.textContent="No qualifying puzzle found — try New again";
  newBtn.disabled=false;
}
function celebrateWin(){
  if(isSolved) return;
  isSolved=true;
  statusEl.textContent="You won!";
  statusEl.className="won";

  const player=document.getElementById("player");
  player.classList.remove("celebrating");
  // Force reflow so the animation reliably restarts.
  void player.offsetWidth;
  player.classList.add("celebrating");
}

function tryMove(dr,dc){
  if(!state || isSolved) return;

  const nr=state.player.r+dr,nc=state.player.c+dc;
  if(!inBounds(nr,nc)) return;

  const before=clone(state);

  // Ball directly ahead: push it one square if free.
  if(nr===state.ball.r && nc===state.ball.c){
    const br=state.ball.r+dr, bc=state.ball.c+dc;
    if(!inBounds(br,bc)) return;
    if(pieceAt(br,bc)!==-1) return;

    state.ball={r:br,c:bc};
    state.player={r:nr,c:nc};
    history.push({state:before,pushCount});
    render();

    if(state.ball.r===state.target.r&&state.ball.c===state.target.c){
      celebrateWin();
    }
    return;
  }

  const hit=pieceAt(nr,nc);
  let pushedTetromino=false;

  if(hit===-1){
    state.player={r:nr,c:nc};
  }else{
    if(!canMovePieceIn(state.pieces,hit,dr,dc)) return;

    // Tetromino cannot move into the ball.
    for(const cell of state.pieces[hit].cells){
      if(cell.r+dr===state.ball.r && cell.c+dc===state.ball.c) return;
    }

    state.pieces[hit].cells.forEach(cell=>{cell.r+=dr;cell.c+=dc});
    state.player={r:nr,c:nc};
    pushedTetromino=true;
  }

  history.push({state:before,pushCount});
  if(pushedTetromino) pushCount++;
  pushCountEl.textContent=pushCount;
  render();
}
function undo(){
  if(history.length===0) return;
  const previous=history.pop();
  state=previous.state;
  pushCount=previous.pushCount;
  pushCountEl.textContent=pushCount;
  isSolved=false;
  document.getElementById("player").classList.remove("celebrating");
  statusEl.textContent="Roll the ball into the hole";
  statusEl.className="";
  render();
}

function reset(){
  if(!initialState) return;
  state=clone(initialState);
  history=[];
  isSolved=false;
  pushCount=0;
  pushCountEl.textContent=pushCount;
  statusEl.textContent="Roll the ball into the hole";
  statusEl.className="";
  render();
}


function handleDirection(dr,dc){
  tryMove(dr,dc);
}

// Keyboard: arrows + WASD.
document.addEventListener("keydown",e=>{
  const map={
    ArrowUp:[-1,0],
    ArrowDown:[1,0],
    ArrowLeft:[0,-1],
    ArrowRight:[0,1],
    w:[-1,0],
    W:[-1,0],
    s:[1,0],
    S:[1,0],
    a:[0,-1],
    A:[0,-1],
    d:[0,1],
    D:[0,1]
  };

  if((e.key==="z"||e.key==="Z")&&(e.ctrlKey||e.metaKey)&&!e.shiftKey&&!e.altKey){
    e.preventDefault();
    undo();
  }else if(map[e.key]){
    e.preventDefault();
    const [dr,dc]=map[e.key];
    handleDirection(dr,dc);
  }else if(e.key.toLowerCase()==="u"){
    undo();
  }else if(e.key.toLowerCase()==="r"){
    reset();
  }else if(e.key.toLowerCase()==="n"){
    generateNewPuzzle();
  }
});

// D-pad.
document.getElementById("moveUp").addEventListener("click",()=>handleDirection(-1,0));
document.getElementById("moveDown").addEventListener("click",()=>handleDirection(1,0));
document.getElementById("moveLeft").addEventListener("click",()=>handleDirection(0,-1));
document.getElementById("moveRight").addEventListener("click",()=>handleDirection(0,1));

// Swipe anywhere on the board. One swipe = one move.
let touchStartX=null, touchStartY=null, touchStartTime=0;
const SWIPE_THRESHOLD=24;
const SWIPE_MAX_TIME=700;

board.addEventListener("touchstart",e=>{
  if(e.touches.length!==1) return;
  const t=e.touches[0];
  touchStartX=t.clientX;
  touchStartY=t.clientY;
  touchStartTime=Date.now();
  if(e.cancelable) e.preventDefault();
},{passive:false});

board.addEventListener("touchmove",e=>{
  if(e.cancelable) e.preventDefault();
},{passive:false});

board.addEventListener("touchend",e=>{
  if(touchStartX===null||touchStartY===null) return;
  if(e.changedTouches.length!==1) return;

  const t=e.changedTouches[0];
  const dx=t.clientX-touchStartX;
  const dy=t.clientY-touchStartY;
  const elapsed=Date.now()-touchStartTime;

  touchStartX=null;
  touchStartY=null;

  if(elapsed>SWIPE_MAX_TIME) return;
  if(Math.max(Math.abs(dx),Math.abs(dy))<SWIPE_THRESHOLD) return;

  if(Math.abs(dx)>Math.abs(dy)){
    handleDirection(0, dx>0 ? 1 : -1);
  }else{
    handleDirection(dy>0 ? 1 : -1, 0);
  }
  if(e.cancelable) e.preventDefault();
},{passive:false});

// Tap one orthogonally adjacent square to move toward it.
// This is intentionally ignored for longer-distance taps.
board.addEventListener("click",e=>{
  if(!state) return;

  const rect=board.getBoundingClientRect();
  const cs=rect.width/7;
  const c=Math.floor((e.clientX-rect.left)/cs);
  const r=Math.floor((e.clientY-rect.top)/cs);

  const dr=r-state.player.r;
  const dc=c-state.player.c;

  if(Math.abs(dr)+Math.abs(dc)===1){
    handleDirection(dr,dc);
  }
});

undoBtn.addEventListener("click",undo);
resetBtn.addEventListener("click",reset);
newBtn.addEventListener("click",generateNewPuzzle);
document.getElementById("prevPuzzle").addEventListener("click",()=>loadPuzzle(currentPuzzleIndex-1));
document.getElementById("nextPuzzle").addEventListener("click",()=>loadPuzzle(currentPuzzleIndex+1));
window.addEventListener("resize",render);

buildBoard();
loadPuzzle(0);
</script>
