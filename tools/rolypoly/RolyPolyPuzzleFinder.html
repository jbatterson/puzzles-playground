<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Roly Poly: Puzzle Finder</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        font-family: 'Outfit', sans-serif;
        margin: 0;
        padding: 0;
      }
      body {
        background: #fff;
        display: flex;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }

      #sidebar {
        width: 320px;
        min-width: 320px;
        background: #f8fafc;
        border-right: 1.5px solid #e2e8f0;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        overflow-y: auto;
        z-index: 10;
      }

      #game-view {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #fff;
        gap: 24px;
      }

      h1 {
        font-size: 1.1rem;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        border-bottom: 1.5px solid #e2e8f0;
        padding-bottom: 12px;
      }

      .label {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        color: #64748b;
        display: block;
        margin-bottom: 4px;
      }

      input[type='range'] {
        accent-color: #000;
        width: 100%;
        cursor: pointer;
      }

      .btn {
        width: 100%;
        padding: 12px;
        border-radius: 4px;
        border: none;
        font-weight: 900;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        cursor: pointer;
      }
      .btn-black {
        background: #000;
        color: #fff;
      }
      .btn-black:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
      .btn-white {
        background: #fff;
        color: #000;
        border: 2px solid #000;
      }
      .btn-white:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
      .btn-green {
        background: #16a34a;
        color: #fff;
      }
      .btn-blue {
        background: #eff6ff;
        color: #2563eb;
        border: 1.5px solid #bfdbfe;
      }

      .btn-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .log {
        font-size: 11px;
        color: #94a3b8;
        text-align: center;
        font-style: italic;
        min-height: 16px;
      }

      .nav-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .nav-arrow {
        font-size: 26px;
        cursor: pointer;
        color: #94a3b8;
        padding: 0 10px;
        user-select: none;
        line-height: 1;
      }
      .nav-arrow:hover:not(.disabled) {
        color: #000;
      }
      .nav-arrow.disabled {
        opacity: 0.2;
        cursor: default;
      }
      .puzzle-label {
        font-size: 12px;
        font-weight: 700;
      }

      .ledger-code {
        font-family: monospace;
        font-size: 10px;
        background: #0f172a;
        color: #38bdf8;
        padding: 12px;
        border-radius: 6px;
        white-space: pre-wrap;
        height: 140px;
        overflow-y: auto;
        border: 1px solid #334155;
        margin-top: 4px;
      }

      /* ── Board ── */
      .board-wrap {
        position: relative;
        border: 2px solid #000;
        background: #fff;
        /* size set inline via style */
      }

      .grid-overlay {
        display: grid;
        width: 100%;
        height: 100%;
        position: absolute;
        inset: 0;
      }

      .cell {
        border: 1px solid rgba(0, 0, 0, 0.1);
        position: relative;
      }

      .cell.target::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 40%;
        height: 40%;
        border-radius: 50%;
        background: #ff3b30;
        opacity: 0.25;
      }

      .cell.block {
        background: #000;
      }

      .cell.hint-up::before {
        content: '↑';
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 900;
        color: rgba(37, 99, 235, 0.7);
        pointer-events: none;
        display: flex;
      }
      .cell.hint-down::before {
        content: '↓';
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 900;
        color: rgba(37, 99, 235, 0.7);
      }
      .cell.hint-left::before {
        content: '←';
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 900;
        color: rgba(37, 99, 235, 0.7);
      }
      .cell.hint-right::before {
        content: '→';
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 900;
        color: rgba(37, 99, 235, 0.7);
      }

      .ball-layer {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        transition:
          left 0.22s cubic-bezier(0.25, 0.46, 0.45, 0.94),
          top 0.22s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        will-change: left, top;
      }

      .ball {
        width: 78%;
        height: 78%;
        border-radius: 50%;
        background: #ff3b30;
      }
      .ball.locked {
        opacity: 0.5;
      }

      .meta-row {
        display: flex;
        gap: 32px;
        align-items: flex-end;
      }
      .meta-stat {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .meta-label {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        color: #94a3b8;
      }
      .meta-num {
        font-size: 2.5rem;
        font-weight: 900;
        line-height: 1;
      }
      .meta-num.good {
        color: #16a34a;
      }
      .meta-num.over {
        color: #dc2626;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef, useCallback } = React

      const MAX_CELL_PX = 80
      /** L,R,U,D order matches tools/rolypoly/rolyPolyBfsSolver.mjs */
      const DIR_STEPS = [
        ['L', 'left'],
        ['R', 'right'],
        ['U', 'up'],
        ['D', 'down'],
      ]
      const LRUD_TO_WORD = { L: 'left', R: 'right', U: 'up', D: 'down' }
      const LRUD_ARROW = { L: '←', R: '→', U: '↑', D: '↓' }

      // ─── Pure game logic (no DOM) ──────────────────────────────────────────────

      function slideState(ballsIn, targets, blocks, dir, gridSize) {
        // Returns { balls, moved } — pure, no mutation
        const balls = ballsIn.map((b) => ({ ...b }))

        const isBlock = (r, c) => blocks.some((b) => b.row === r && b.col === c)

        let sorted
        if (dir === 'left') sorted = balls.slice().sort((a, b) => a.col - b.col)
        if (dir === 'right') sorted = balls.slice().sort((a, b) => b.col - a.col)
        if (dir === 'up') sorted = balls.slice().sort((a, b) => a.row - b.row)
        if (dir === 'down') sorted = balls.slice().sort((a, b) => b.row - a.row)

        let moved = false

        sorted.forEach((ball) => {
          if (ball.locked) return
          let r = ball.row,
            c = ball.col
          while (true) {
            let nr = r,
              nc = c
            if (dir === 'left') nc--
            if (dir === 'right') nc++
            if (dir === 'up') nr--
            if (dir === 'down') nr++
            if (nr < 0 || nr >= gridSize || nc < 0 || nc >= gridSize) break
            if (isBlock(nr, nc)) break
            if (balls.some((o) => o.id !== ball.id && o.row === nr && o.col === nc)) break
            r = nr
            c = nc
            if (targets.some((t) => t.row === r && t.col === c)) {
              ball.locked = true
              break
            }
          }
          if (r !== ball.row || c !== ball.col) moved = true
          ball.row = r
          ball.col = c
        })

        return { balls, moved }
      }

      function isSolved(balls, targets) {
        return targets.every((t) =>
          balls.some((b) => b.row === t.row && b.col === t.col && b.locked)
        )
      }

      function stateKey(balls) {
        return [...balls]
          .sort((a, b) => a.id - b.id)
          .map((b) => `${b.row},${b.col},${b.locked ? 1 : 0}`)
          .join('|')
      }

      function cloneBalls(balls) {
        return balls.map((b) => ({ ...b }))
      }

      function stepInnerCost(balls) {
        return balls.filter((b) => !b.locked).length
      }

      /**
       * Shortest moves, then lowest inner dif sum, then lex smallest LRUD — mirrors tools/rolypoly/rolyPolyBfsSolver.mjs.
       * @returns {{ solvable: true, par, solution, dif, solns } | { solvable: false }}
       */
      function analyzeCanonicalLayout(initBalls, targets, blocks, gridSize, maxNodes = 2000000) {
        const startKey = stateKey(initBalls)
        if (isSolved(initBalls, targets)) {
          return { solvable: true, par: 0, solution: '', dif: 0, solns: 1 }
        }

        const dist = new Map()
        const ways = new Map()
        const states = new Map()
        dist.set(startKey, 0)
        ways.set(startKey, 1n)
        states.set(startKey, cloneBalls(initBalls))

        const queue = [startKey]
        let head = 0
        let explored = 0

        while (head < queue.length) {
          const k = queue[head++]
          explored++
          if (explored > maxNodes) return { solvable: false }

          const cur = states.get(k)
          const d = dist.get(k)

          for (const [, dir] of DIR_STEPS) {
            const { balls: nb, moved } = slideState(cur, targets, blocks, dir, gridSize)
            if (!moved) continue
            const nk = stateKey(nb)
            const nd = d + 1
            if (!dist.has(nk)) {
              dist.set(nk, nd)
              ways.set(nk, ways.get(k))
              states.set(nk, cloneBalls(nb))
              queue.push(nk)
            } else if (dist.get(nk) === nd) {
              ways.set(nk, ways.get(nk) + ways.get(k))
            }
          }
        }

        let par = Infinity
        for (const [k, balls] of states) {
          if (isSolved(balls, targets)) {
            const dd = dist.get(k)
            if (dd < par) par = dd
          }
        }
        if (!Number.isFinite(par)) return { solvable: false }

        let solnsBig = 0n
        for (const [k, balls] of states) {
          if (isSolved(balls, targets) && dist.get(k) === par) {
            solnsBig += ways.get(k)
          }
        }
        const MAX_SAFE = Number.MAX_SAFE_INTEGER
        const solns = solnsBig <= BigInt(MAX_SAFE) ? Number(solnsBig) : null

        const prefixMin = new Map()
        prefixMin.set(startKey, 0)
        const byDist = Array.from({ length: par + 1 }, () => [])
        for (const k of dist.keys()) {
          const dd = dist.get(k)
          if (dd <= par) byDist[dd].push(k)
        }

        for (let d = 0; d < par; d++) {
          for (const k of byDist[d]) {
            const u = states.get(k)
            const base = prefixMin.get(k)
            if (base === undefined) continue
            for (const [, dir] of DIR_STEPS) {
              const { balls: nb, moved } = slideState(u, targets, blocks, dir, gridSize)
              if (!moved) continue
              const nk = stateKey(nb)
              if (dist.get(nk) !== d + 1) continue
              const cost = stepInnerCost(u)
              const cand = base + cost
              const prev = prefixMin.get(nk)
              if (prev === undefined || cand < prev) prefixMin.set(nk, cand)
            }
          }
        }

        let OPT = Infinity
        for (const [k, balls] of states) {
          if (!isSolved(balls, targets) || dist.get(k) !== par) continue
          const pm = prefixMin.get(k)
          if (pm !== undefined && pm < OPT) OPT = pm
        }
        if (!Number.isFinite(OPT)) return { solvable: false }

        const goodGoals = []
        for (const [k, balls] of states) {
          if (!isSolved(balls, targets) || dist.get(k) !== par) continue
          if (prefixMin.get(k) === OPT) goodGoals.push(k)
        }
        if (!goodGoals.length) return { solvable: false }

        const suffixFrom = new Map()
        for (const g of goodGoals) suffixFrom.set(g, 0)

        for (let d = par - 1; d >= 0; d--) {
          for (const k of byDist[d]) {
            const u = states.get(k)
            let best = Infinity
            for (const [, dir] of DIR_STEPS) {
              const { balls: nb, moved } = slideState(u, targets, blocks, dir, gridSize)
              if (!moved) continue
              const nk = stateKey(nb)
              if (dist.get(nk) !== d + 1) continue
              const sv = suffixFrom.get(nk)
              if (sv === undefined) continue
              const c = stepInnerCost(u) + sv
              if (c < best) best = c
            }
            if (best < Infinity) suffixFrom.set(k, best)
          }
        }

        if (suffixFrom.get(startKey) !== OPT) return { solvable: false }

        let path = ''
        let curKey = startKey
        for (let step = 0; step < par; step++) {
          const u = states.get(curKey)
          const du = dist.get(curKey)
          const pu = prefixMin.get(curKey)
          let picked = null
          let pickedKey = null
          for (const [ch, dir] of DIR_STEPS) {
            const { balls: nb, moved } = slideState(u, targets, blocks, dir, gridSize)
            if (!moved) continue
            const nk = stateKey(nb)
            if (dist.get(nk) !== du + 1) continue
            const cost = stepInnerCost(u)
            const pv = prefixMin.get(nk)
            if (pv !== pu + cost) continue
            const sv = suffixFrom.get(nk)
            if (sv === undefined || pv + sv !== OPT) continue
            picked = ch
            pickedKey = nk
            break
          }
          if (picked == null) return { solvable: false }
          path += picked
          curKey = pickedKey
        }

        const dif = OPT * gridSize
        return { solvable: true, par, solution: path, dif, solns }
      }

      // ─── Random layout ─────────────────────────────────────────────────────────

      function pickRandom(n, exclude, gridSize) {
        const used = new Set(exclude.map(([r, c]) => r * gridSize + c))
        const chosen = []
        let safety = 0
        while (chosen.length < n && safety++ < 10000) {
          const r = Math.floor(Math.random() * gridSize)
          const c = Math.floor(Math.random() * gridSize)
          const key = r * gridSize + c
          if (!used.has(key)) {
            used.add(key)
            chosen.push([r, c])
          }
        }
        return chosen
      }

      function generateLayout(numBalls, numBlocks, gridSize) {
        const ballPos = pickRandom(numBalls, [], gridSize)
        const targetPos = pickRandom(numBalls, ballPos, gridSize)
        const blockPos = pickRandom(numBlocks, [...ballPos, ...targetPos], gridSize)
        const balls = ballPos.map(([r, c], i) => ({ id: i, row: r, col: c, locked: false }))
        const targets = targetPos.map(([r, c]) => ({ row: r, col: c }))
        const blocks = blockPos.map(([r, c]) => ({ row: r, col: c }))
        return { balls, targets, blocks }
      }

      // ─── Board component ────────────────────────────────────────────────────────

      function Board({ puzzle, showHint, boardPx, gridSize }) {
        const { targets, blocks } = puzzle
        const [balls, setBalls] = useState(null)
        const [moves, setMoves] = useState(0)
        const [isAnimating, setIsAnimating] = useState(false)
        const [history, setHistory] = useState([])

        // Reset whenever puzzle changes
        useEffect(() => {
          setBalls(puzzle.balls.map((b) => ({ ...b })))
          setMoves(0)
          setHistory([])
          setIsAnimating(false)
        }, [puzzle])

        const gs = puzzle.gridSize ?? gridSize
        const cs = boardPx / gs

        const doSlide = useCallback(
          (dir) => {
            if (isAnimating || !balls) return
            const { balls: next, moved } = slideState(balls, targets, blocks, dir, gs)
            if (!moved) return
            setHistory((h) => [...h, { balls: balls.map((b) => ({ ...b })), moves }])
            setMoves((m) => m + 1)
            setIsAnimating(true)
            setBalls(next)
            setTimeout(() => setIsAnimating(false), 260)
          },
          [balls, targets, blocks, isAnimating, moves, gs]
        )

        const doUndo = () => {
          if (!history.length || isAnimating) return
          const prev = history[history.length - 1]
          setHistory((h) => h.slice(0, -1))
          setBalls(prev.balls)
          setMoves(prev.moves)
        }

        const doReset = () => {
          setBalls(puzzle.balls.map((b) => ({ ...b })))
          setMoves(0)
          setHistory([])
          setIsAnimating(false)
        }

        useEffect(() => {
          const handler = (e) => {
            const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' }
            if (map[e.key]) {
              e.preventDefault()
              doSlide(map[e.key])
            }
          }
          window.addEventListener('keydown', handler)
          return () => window.removeEventListener('keydown', handler)
        }, [doSlide])

        if (!balls) return null

        const solved = isSolved(balls, targets)
        const par = puzzle.par
        const moveClass = solved ? (moves <= par ? 'good' : 'over') : ''

        // Build hint cell set: for each step in solution, mark the "action" cell
        // We highlight the first move of the solution on the current state by
        // showing the direction arrow on every non-locked ball
        const hintDir =
          showHint && puzzle.solution && puzzle.solution.length > 0
            ? LRUD_TO_WORD[puzzle.solution[0]]
            : null

        return (
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16 }}>
            {/* Meta row */}
            <div className="meta-row">
              <div className="meta-stat">
                <span className="meta-label">Moves</span>
                <span className={`meta-num ${moveClass}`}>{moves}</span>
              </div>
              <div className="meta-stat">
                <span className="meta-label">Par</span>
                <span className="meta-num">{par}</span>
              </div>
            </div>

            {/* Board */}
            <div className="board-wrap" style={{ width: boardPx, height: boardPx }}>
              {/* Grid */}
              <div
                className="grid-overlay"
                style={{
                  gridTemplateColumns: `repeat(${gs}, 1fr)`,
                  gridTemplateRows: `repeat(${gs}, 1fr)`,
                }}
              >
                {Array.from({ length: gs * gs }, (_, i) => {
                  const r = Math.floor(i / gs),
                    c = i % gs
                  const isTarget = targets.some((t) => t.row === r && t.col === c)
                  const isBlk = blocks.some((b) => b.row === r && b.col === c)
                  const isHint =
                    hintDir &&
                    !isBlk &&
                    !isTarget &&
                    !balls.some((b) => b.row === r && b.col === c && b.locked)
                  // Show hint arrow only in cells that contain unlocked balls
                  const hasBall = balls.some((b) => b.row === r && b.col === c && !b.locked)
                  let cls = 'cell'
                  if (isTarget) cls += ' target'
                  if (isBlk) cls += ' block'
                  if (hintDir && hasBall) cls += ` hint-${hintDir}`
                  return <div key={i} className={cls} />
                })}
              </div>

              {/* Balls */}
              {balls.map((ball) => (
                <div
                  key={ball.id}
                  className="ball-layer"
                  style={{ width: cs, height: cs, left: ball.col * cs, top: ball.row * cs }}
                >
                  <div className={`ball${ball.locked ? ' locked' : ''}`} />
                </div>
              ))}
            </div>

            {/* Controls */}
            <div
              style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, width: boardPx }}
            >
              <button
                className="btn btn-white"
                onClick={doUndo}
                disabled={!history.length || isAnimating}
              >
                Undo
              </button>
              <button className="btn btn-white" onClick={doReset}>
                Reset
              </button>
            </div>
          </div>
        )
      }

      // ─── Main app ───────────────────────────────────────────────────────────────

      function App() {
        const [gridSize, setGridSize] = useState(7)
        const [numBalls, setNumBalls] = useState(3)
        const [numBlocks, setNumBlocks] = useState(3)
        const [minMoves, setMinMoves] = useState(4)
        const [batch, setBatch] = useState([])
        const [batchIdx, setBatchIdx] = useState(-1)
        const [log, setLog] = useState('Ready')
        const [isSearching, setIsSearching] = useState(false)
        const [showHint, setShowHint] = useState(false)
        const [ledger, setLedger] = useState('')

        const boardPx = Math.min(420, gridSize * MAX_CELL_PX)
        const BATCH_SIZE = 10
        const MAX_ATTEMPTS = 5000
        const BFS_MAX = 20 // cap BFS depth to keep it snappy

        const generateBatch = () => {
          setIsSearching(true)
          setLog('Scanning...')
          setShowHint(false)
          setBatch([])
          setBatchIdx(-1)

          setTimeout(() => {
            const found = []
            let attempts = 0

            while (found.length < BATCH_SIZE && attempts < MAX_ATTEMPTS) {
              attempts++
              const { balls, targets, blocks } = generateLayout(numBalls, numBlocks, gridSize)
              const r = analyzeCanonicalLayout(balls, targets, blocks, gridSize)
              if (r.solvable && r.par >= minMoves && r.par <= BFS_MAX) {
                found.push({
                  balls,
                  targets,
                  blocks,
                  par: r.par,
                  solution: r.solution,
                  dif: r.dif,
                  solns: r.solns,
                  gridSize,
                })
              }
            }

            setBatch(found)
            setBatchIdx(found.length > 0 ? 0 : -1)
            setLog(
              found.length > 0
                ? `Found ${found.length} puzzle${found.length > 1 ? 's' : ''} in ${attempts} attempts`
                : 'No puzzles found — try fewer balls or lower Min Moves'
            )
            setIsSearching(false)
          }, 50)
        }

        const copyToLedger = () => {
          const p = batch[batchIdx]
          const fmt = (arr) => `[${arr.map(([r, c]) => `[${r},${c}]`).join(',')}]`
          const ballArr = p.balls.map((b) => [b.row, b.col])
          const targetArr = p.targets.map((t) => [t.row, t.col])
          const blockArr = p.blocks.map((b) => [b.row, b.col])
          const sz = p.gridSize ?? gridSize
          const solnsPart = p.solns != null ? `, solns: ${p.solns}` : ''
          const line = `{ size: ${sz}, balls: ${fmt(ballArr)}, targets: ${fmt(targetArr)}, blocks: ${fmt(blockArr)}, par: ${p.par}, solution: "${p.solution}", dif: ${p.dif}${solnsPart} },\n`
          setLedger((prev) => prev + line)
        }

        const currentPuzzle = batchIdx >= 0 ? batch[batchIdx] : null

        return (
          <div style={{ display: 'flex', width: '100vw', height: '100vh' }}>
            {/* ── Sidebar ── */}
            <div id="sidebar">
              <h1>Roly Poly Architect</h1>

              {/* Sliders */}
              <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
                <div>
                  <span className="label">
                    Grid size: {gridSize} × {gridSize}
                  </span>
                  <input
                    type="range"
                    min="5"
                    max="7"
                    step="1"
                    value={gridSize}
                    onChange={(e) => setGridSize(Number(e.target.value))}
                  />
                </div>
                <div>
                  <span className="label">Balls / Targets: {numBalls}</span>
                  <input
                    type="range"
                    min="1"
                    max="5"
                    value={numBalls}
                    onChange={(e) => setNumBalls(Number(e.target.value))}
                  />
                </div>
                <div>
                  <span className="label">Blocks: {numBlocks}</span>
                  <input
                    type="range"
                    min="0"
                    max="5"
                    value={numBlocks}
                    onChange={(e) => setNumBlocks(Number(e.target.value))}
                  />
                </div>
                <div>
                  <span className="label">Minimum Moves: {minMoves}</span>
                  <input
                    type="range"
                    min="3"
                    max="20"
                    value={minMoves}
                    onChange={(e) => setMinMoves(Number(e.target.value))}
                  />
                </div>
              </div>

              <button className="btn btn-black" onClick={generateBatch} disabled={isSearching}>
                {isSearching ? 'Searching…' : 'Generate Batch'}
              </button>

              <p className="log">{log}</p>

              {/* Batch nav */}
              {batchIdx >= 0 && (
                <div
                  style={{
                    display: 'flex',
                    flexDirection: 'column',
                    gap: 10,
                    paddingTop: 12,
                    borderTop: '1.5px solid #e2e8f0',
                  }}
                >
                  <div className="nav-row">
                    <span className="puzzle-label">
                      Puzzle {batchIdx + 1} / {batch.length}
                    </span>
                    <div style={{ display: 'flex' }}>
                      <div
                        className={`nav-arrow ${batchIdx === 0 ? 'disabled' : ''}`}
                        onClick={() => {
                          setShowHint(false)
                          setBatchIdx((i) => Math.max(0, i - 1))
                        }}
                      >
                        ←
                      </div>
                      <div
                        className={`nav-arrow ${batchIdx === batch.length - 1 ? 'disabled' : ''}`}
                        onClick={() => {
                          setShowHint(false)
                          setBatchIdx((i) => Math.min(batch.length - 1, i + 1))
                        }}
                      >
                        →
                      </div>
                    </div>
                  </div>

                  <button className="btn btn-blue" onClick={() => setShowHint((h) => !h)}>
                    {showHint ? 'Hide Hint' : 'Show Next Move'}
                  </button>

                  <div className="btn-row">
                    <button className="btn btn-green" onClick={copyToLedger}>
                      Add to Ledger
                    </button>
                  </div>

                  {/* Solution path */}
                  {showHint && currentPuzzle && (
                    <div
                      style={{
                        background: '#eff6ff',
                        border: '1.5px solid #bfdbfe',
                        borderRadius: 4,
                        padding: '10px 12px',
                      }}
                    >
                      <span className="label" style={{ marginBottom: 6 }}>
                        Solution path ({currentPuzzle.par} moves)
                      </span>
                      <div style={{ fontSize: 12, fontWeight: 700, color: '#64748b', marginTop: 4 }}>
                        solns: {currentPuzzle.solns != null ? currentPuzzle.solns : '—'}
                      </div>
                      <div style={{ fontSize: 18, fontWeight: 900, letterSpacing: '0.15em' }}>
                        {[...currentPuzzle.solution].map((ch) => LRUD_ARROW[ch] || ch).join(' ')}
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* Ledger */}
              <div style={{ marginTop: 'auto' }}>
                <span className="label">Ledger</span>
                <div className="ledger-code">{ledger || '// Approved puzzles...'}</div>
                <div className="btn-row" style={{ marginTop: 8 }}>
                  <button
                    type="button"
                    className="btn btn-white"
                    disabled={!ledger}
                    onClick={() => ledger && navigator.clipboard.writeText(ledger)}
                  >
                    Copy Ledger
                  </button>
                  <button
                    type="button"
                    className="btn btn-white"
                    disabled={!ledger}
                    onClick={() => setLedger('')}
                  >
                    Clear Ledger
                  </button>
                </div>
              </div>
            </div>

            {/* ── Game view ── */}
            <div id="game-view">
              {currentPuzzle ? (
                <Board
                  key={batchIdx}
                  puzzle={currentPuzzle}
                  showHint={showHint}
                  boardPx={boardPx}
                  gridSize={gridSize}
                />
              ) : (
                <div
                  style={{
                    color: '#94a3b8',
                    fontWeight: 700,
                    fontSize: 13,
                    textTransform: 'uppercase',
                    letterSpacing: '0.08em',
                  }}
                >
                  Generate a batch to begin
                </div>
              )}
            </div>
          </div>
        )
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>
  </body>
</html>
